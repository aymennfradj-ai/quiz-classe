<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestion des documents</title>
<style>
:root{--bg:#f4f6f9;--fg:#1b2430;--card:#fff;--muted:#66727f;--accent:#1d5fd6;--ok:#1f8a4c;--bad:#c63a3a;--line:#d9dfe6}
@media (prefers-color-scheme:dark){:root{--bg:#11161c;--fg:#e8edf2;--card:#1a212a;--muted:#97a3af;--accent:#6aa1ff;--ok:#4cc47f;--bad:#ff7d7d;--line:#2b3540}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
h1{font-size:1.3rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
#app{display:grid;gap:16px}
#app[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 200px}
label{display:block;font-weight:600;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{font:inherit;cursor:pointer;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.err{background:var(--bad);color:#fff;padding:10px 14px;border-radius:8px}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.q{border-top:1px solid var(--line);padding:10px 0}
.q:first-child{border-top:0}
.q code{font-family:ui-monospace,Consolas,monospace}
.q ul{margin:4px 0;padding-left:1.2em}
.q li.right{color:var(--ok);font-weight:700}
.stat{font-size:1.6rem;font-weight:700}
ol{padding-left:1.4em;margin:6px 0}
li .pts{float:right;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:6px;margin-top:8px}
.bar{display:flex;gap:8px;align-items:center}
.bar i{display:block;height:14px;background:var(--accent);border-radius:3px;min-width:2px}
.bar.right i{background:var(--ok)}
a{color:var(--accent)}
a.btn{display:inline-block;text-decoration:none;padding:10px 16px;border-radius:8px;border:1px solid var(--line);color:var(--fg)}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="row"><h1 class="grow">Gestion des documents</h1><a class="btn" href="index.html">Accueil</a></div>
<p id="err" class="err" hidden></p>
<section id="login" class="card" hidden>
  <h2>Connexion enseignant</h2>
  <label for="email">E-mail</label><input id="email" type="email" autocomplete="username">
  <label for="pass">Mot de passe</label><input id="pass" type="password" autocomplete="current-password">
  <p><button id="loginBtn" class="primary">Se connecter</button></p>
</section>
<div id="app" hidden>
<section class="card">
  <h2>Ajouter un document</h2>
  <label for="title">Titre</label><input id="title" maxlength="100" placeholder="Série 2 : les tableaux">
  <label for="level">Niveau</label>
  <input id="level" list="levels" maxlength="50">
  <datalist id="levels"><option value="1ère année"><option value="2ème année"><option value="3ème Sciences"><option value="Bac Sciences"></datalist>
  <label for="type">Type</label><select id="type"><option>Cours</option><option>Série</option><option>Examen</option><option>Corrigé</option></select>
  <label for="url">Lien du fichier (Google Drive)</label><input id="url" type="url" placeholder="https://drive.google.com/file/d/...">
  <p><button id="addBtn" class="primary">Publier</button></p>
  <p id="msg" class="muted"></p>
</section>
<section class="card"><h2>Documents publiés</h2><div id="list"></div></section>
</div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app);
function showError(m) { $("err").textContent = m; $("err").hidden = !m; }
function el(tag, text, cls) { const e = document.createElement(tag); if (text) e.textContent = text; if (cls) e.className = cls; return e; }
// lien de téléchargement direct pour un fichier Google Drive
function downloadUrl(url) {
  const u = new URL(url), id = u.pathname.match(/\/file\/d\/([^/]+)/);
  return u.hostname === "drive.google.com" && id ? "https://drive.google.com/uc?export=download&id=" + id[1] : null;
}
function link(text, href, cls) { const a = el("a", text, cls); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
let stop = null;
$("loginBtn").addEventListener("click", async () => {
  showError("");
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { showError("Connexion refusée. Vérifie l'e-mail et le mot de passe."); }
});
onAuthStateChanged(auth, user => {
  if (stop) { stop(); stop = null; }
  const teacher = !!user && !user.isAnonymous;
  $("login").hidden = teacher; $("app").hidden = !teacher;
  if (!teacher) return;
  stop = onSnapshot(collection(db, "documents"), s => {
    const rows = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.order - a.order);
    $("list").replaceChildren(...rows.map(d => {
      const box = el("div", "", "q"), row = el("div", "", "row"), del = el("button", "Supprimer", "danger");
      del.addEventListener("click", async () => {
        if (!confirm("Supprimer « " + d.title + " » ?")) return;
        try { await deleteDoc(doc(db, "documents", d.id)); }
        catch (e) { showError("Suppression impossible : " + e.message); }
      });
      row.append(link("Ouvrir", d.url, "btn"), del);
      box.append(el("b", d.title), el("p", d.level + " · " + d.type, "muted"), row);
      return box;
    }));
  }, () => showError("Lecture impossible. Vérifie les règles Firestore."));
});
$("addBtn").addEventListener("click", async () => {
  showError(""); $("msg").textContent = "";
  const title = $("title").value.trim(), level = $("level").value.trim(), url = $("url").value.trim();
  if (!title || !level || !url.startsWith("https://")) { showError("Remplis le titre, le niveau et un lien commençant par https://"); return; }
  $("addBtn").disabled = true;
  try {
    await addDoc(collection(db, "documents"), { title, level, type: $("type").value, url, order: Date.now() });
    $("title").value = ""; $("url").value = ""; $("msg").textContent = "✅ Document publié.";
  } catch (e) { showError("Publication impossible. Vérifie les règles Firestore."); }
  $("addBtn").disabled = false;
});
</script>
</body>
</html>
